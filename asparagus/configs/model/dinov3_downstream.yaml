dimensions: 3D

pretrain_net:
seg_net: dino3d_seg
cls_net: dino3d_clsreg
plugin_seg_net:
plugin_seg_train_n_last_params:

_seg_net:
  _target_: asparagus.modules.networks.dino_downstream.dino3d_seg
  img_size: [96, 96, 96]
  patch_size: [16, 16, 16]
  hidden_size: 384

_cls_net:
  _target_: asparagus.modules.networks.dino_downstream.dino3d_clsreg
  img_size: [96, 96, 96]
  patch_size: [16, 16, 16]
  hidden_size: 384
  dropout: 0.1

pretrain_optim: AdamW
pretrain_lr: 0.0005
train_optim: AdamW
train_lr: 0.0001
finetune_optim: AdamW
finetune_lr: 0.0001
weight_decay: 0.05
nesterov: false
momentum: 0.9

patch_embed_size: [16, 16, 16]
min_test_patch_size: ${training.patch_size}
deep_supervision: false
