# @package _global_
defaults:
  - /default_pretrain
  - /model/swinunetr_hybrid_b@model
  - /model/tuke_sequence_classes@sequence
  - /hardware/1node8gpus@hardware
  - _self_

task: PT902_FOMO300K_HF
root: tuke_hybrid
stem: production

# A stable short directory is also what makes automatic restart discover the
# same run and its checkpoints.
run_dir: ${oc.env:ASPARAGUS_MODELS}/${task}/tuke_hybrid/production
run_id: ${oc.env:TUKE_HYBRID_RUN_ID,production_v1}
hydra:
  run:
    dir: ${run_dir}/run_id=${run_id}

resume_training: true

training:
  seed: 311598
  patch_size: [96, 96, 96]
  batch_size: 2
  accumulate_grad_batches: 2
  max_samples: 6_000_000
  steps_per_epoch: 1890
  val_steps_per_epoch: 18
  warmup_ratio: 0.02
  warmup_epochs: 8
  rec_loss_masked_only: true
  check_val_every_n_epoch: 3

model:
  ckpt_every_n_epoch: 1
  ckpt_every_n_train_steps: 25000
  ckpt_save_top_k: -1

logger:
  wandb_logging: false
  wandb_project: FOMO26-TUKE-Hybrid
  log_every_n_steps: 100
  log_images_every_n_epoch: 5
