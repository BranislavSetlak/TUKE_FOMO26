# @package _global_
defaults:
  - /core/base@
  - /default_pretrain@
  - /hardware/1gpu12cpu@hardware
  - /model/dinov2_test@model
  - _self_

# Keep command-line overrides in Hydra's saved config, but do not concatenate
# them into a single filesystem component (Linux limits a component to 255 B).
hydra:
  job:
    config:
      override_dirname:
        exclude_keys:
          - +model
          - +hardware
          - checkpoint_run_id
          - hf_model_id
          - hf_weight_format
          - data.test_split
          - hardware
          - hardware.accelerator
          - hardware.num_devices
          - hardware.num_nodes
          - hardware.num_workers
          - hardware.precision
          - hardware.strategy
          - load_checkpoint_name
          - model
          - model.net
          - model.dimensions
          - model.ckpt_every_n_epoch
          - root
          - run_id
          - stem
          - task
          - resume_training
          - training.accumulate_grad_batches
          - training.batch_size
          - training.check_val_every_n_epoch
          - training.max_samples
          - training.steps_per_epoch
          - training.val_steps_per_epoch
          - logger.log_every_n_steps
          - logger.log_to_stdout
          - logger.wandb_logging

task: PT902_FOMO300K_HF
root: datapaper
stem: dinov3_3d_stage1

lightning:
  lightning_module: DINOv2Module
  _trainer:
    strategy: ${hardware.strategy}

transforms:
  cpu_tr_transforms: dinov2
  cpu_val_transforms: dinov2
  gpu_tr_transforms: none
  gpu_val_transforms: none
  masking: false
  _cpu_tr_transforms:
    global_view_size: ${training.global_crop_size}
    local_view_size: ${training.local_crop_size}
  _cpu_val_transforms:
    global_view_size: ${training.global_crop_size}
    local_view_size: ${training.local_crop_size}

model:
  dimensions: 3D
  hidden_size: 384
  projection_dim: 8192
  ibot_separate_head: true
  patch_embed_size: [16, 16, 16]
  pretrain_lr: 0.0005
  ckpt_every_n_epoch: 1

training:
  # Input crop and transformer patch are deliberately separate settings.
  patch_size: [96, 96, 96]
  global_crop_size: [96, 96, 96]
  local_crop_size: [48, 48, 48]
  mask_ratio: 0.30
  batch_size: 2
  accumulate_grad_batches: 1
  max_samples: 1_000_000
  steps_per_epoch: 500
  val_steps_per_epoch: 0
  check_val_every_n_epoch: 999999

logger:
  progress_bar: true
  wandb_log_model: false
  wandb_logging: false
  mlflow_logging: false
  log_every_n_steps: 10
  log_images_every_n_epoch: 1
  log_to_stdout: true
  wandb_project: FOMO26-DINO3D-Stage1
